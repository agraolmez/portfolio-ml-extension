name: Verify research release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  aggregate-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_release.py
      - run: python replication/scripts/verify_results.py --output results/aggregate
      - run: python tools/run_portable_tests.py
